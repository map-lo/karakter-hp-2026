name: Refresh release catalogue

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
    inputs:
      allow_removals:
        description: Allow removal of cached albums after reviewing roster/source changes
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-import
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Import catalogue without touching editorial changes
        env:
          ALLOW_REMOVALS: ${{ inputs.allow_removals }}
        run: |
          if [[ "$ALLOW_REMOVALS" == "true" ]]; then
            npm run releases -- --allow-removals
          else
            npm run releases
          fi
      - run: npm test
      - run: npm run check
      - run: npm run build
      - name: Open reviewable catalogue update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- src/data/releases.json; then
            echo "Catalogue unchanged."
            exit 0
          fi
          branch="content/releases-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/releases.json
          git commit -m "content: refresh imported release catalogue" \
            -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Refresh imported release catalogue" \
            --body "Automated iTunes cache refresh. Content validation, tests, type-check and static build passed in the refresh workflow. Editorial overrides and manual releases are unchanged. Review catalogue differences before merging."
