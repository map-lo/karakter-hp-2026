media:
  input: public/uploads
  output: /uploads
  extensions: [jpg, jpeg, png, webp, gif, avif]
  rename: safe

components:
  page:
    type: rich-text
    options:
      format: markdown
      media: false
  releaseKind:
    type: select
    options:
      values: [album, ep, single]

content:
  - name: pages
    label: Text pages
    type: group
    items:
      - name: about
        label: About
        type: file
        path: src/content/pages/about.md
        format: yaml-frontmatter
        fields: &pageFields
          - name: title
            type: string
            required: true
          - name: description
            label: Search / sharing description
            type: text
            required: true
          - name: body
            component: page
            required: true
      - name: imprint
        label: Imprint
        type: file
        path: src/content/pages/imprint.md
        format: yaml-frontmatter
        fields: *pageFields
      - name: privacy
        label: Privacy policy
        type: file
        path: src/content/pages/privacy.md
        format: yaml-frontmatter
        fields: *pageFields

  - name: artists
    label: Artist roster
    type: file
    path: src/data/artists.json
    format: json
    fields:
      - name: artists
        label: Artists (website sorts alphabetically by name; list order is ignored)
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name}"
        fields:
          - name: id
            label: Stable artist ID
            type: string
            required: true
            pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
            description: Keep unchanged when renaming an artist. Releases refer to this ID.
          - name: name
            type: string
            required: true
          - name: url
            label: Website
            type: string
            required: true
          - name: alternateUrl
            label: Alternate link (reference only)
            type: string

  - name: site
    label: Shared company details and links
    type: file
    path: src/data/site.json
    format: json
    fields:
      - name: companyName
        label: Company name
        type: string
        required: true
      - name: address
        type: text
        required: true
      - name: email
        type: string
        required: true
      - name: instagramUrl
        label: Instagram URL
        type: string
        required: true
      - name: instagramHandle
        label: Instagram handle
        type: string
        required: true
      - name: spotifyUrl
        label: Spotify link
        type: string
        required: true
      - name: appleMusicUrl
        label: Apple Music link
        type: string
        required: true

  - name: releases
    label: Releases
    type: file
    path: src/data/releases.json
    format: json
    fields:
      - name: releases
        label: Releases (website sorts newest first by release date; list order is ignored)
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{releaseDate} / {title} / {artistId}"
        fields:
          - name: visible
            label: Show release on website
            type: boolean
            default: true
            description: Turn off to hide the whole release (cover and link) without deleting it.
          - name: artistId
            label: Artist ID
            type: string
            required: true
            pattern:
              regex: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
              message: Use the stable ID from the Artist roster, e.g. get-well-soon.
            description: Copy the stable ID from the Artist roster.
          - name: title
            type: string
            required: true
          - name: kind
            component: releaseKind
            required: true
          - name: releaseDate
            label: Release date
            type: date
            required: true
            description: Determines the position on the website (newest first).
            options:
              format: yyyy-MM-dd
              time: false
          - name: label
            type: string
          - name: url
            label: Release link (blank falls back to artist website)
            type: string
          - name: artwork
            label: Artwork upload
            type: image
            description: >-
              Use either this upload OR the artwork URL below, not both.
              Suggested: square, 600 × 600 px, JPG or WebP, ideally under 150 KB.
              Covers display at most ~110 px wide and uploads are not resized automatically,
              so larger files only slow down the page.
            options:
              extensions: [jpg, jpeg, png, webp]
          - name: artworkUrl
            label: Artwork URL
            type: string
            description: >-
              Use either this http(s) URL OR the upload above, not both.
              Prefer a square ~600 × 600 px image, e.g. Apple Music's ".../600x600bb.jpg".
